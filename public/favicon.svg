    <linearGradient id="fc-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39C5BB"/>
      <stop offset="100%" stop-color="#48FFF4"/>
    </linearGradient>
  </defs>
  <!-- Chamfered plate (14px cut) -->
  <path d="M14 2h36l12 12v36L50 62H14L2 50V14Z" fill="#0F1419" stroke="url(#fc-border)" stroke-width="2.5"/>
