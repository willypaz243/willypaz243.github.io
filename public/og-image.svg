<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Willy Samuel Paz Colque — AI &amp; Full Stack Developer</title>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');</style>
  <defs>
    <linearGradient id="border-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39C5BB"/>
      <stop offset="100%" stop-color="#48FFF4"/>
    </linearGradient>
    <radialGradient id="glow-left" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#39C5BB" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#39C5BB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hud-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#48FFF4" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <pattern id="hazard" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="10" height="20" fill="#FFD700" opacity="0.28"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0F1419"/>
  <rect width="1200" height="630" fill="url(#hud-grid)"/>
  <ellipse cx="380" cy="300" rx="470" ry="350" fill="url(#glow-left)"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#border-grad)" opacity="0.65"/>

  <!-- ============ LEFT: IDENTITY MODULE ============ -->
  <!-- System line -->
  <circle cx="71" cy="90" r="5" fill="#48FFF4"/>
  <text x="88" y="96" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="500" letter-spacing="3" fill="#48FFF4">WPC-04 // IDENTITY MODULE</text>

  <!-- Name -->
  <text x="64" y="185" font-family="'Inter', sans-serif" font-size="62" font-weight="700" letter-spacing="-1.5" fill="#F0F6FC">Willy Samuel</text>
  <text x="64" y="255" font-family="'Inter', sans-serif" font-size="62" font-weight="700" letter-spacing="-1.5" fill="#F0F6FC">Paz Colque</text>

  <!-- Role plate (chamfered) -->
  <path d="M74 290h458l10 10v26l-10 10H74l-10-10v-26Z" fill="#39C5BB" fill-opacity="0.10" stroke="#39C5BB" stroke-width="1.5"/>
  <text x="86" y="319" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" letter-spacing="2.5" fill="#48FFF4">AI &amp; FULL STACK DEVELOPER</text>

  <!-- Availability -->
  <circle cx="71" cy="379" r="5" fill="#00E676"/>
  <text x="88" y="384" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500" letter-spacing="2" fill="#00E676">OPEN TO REMOTE WORK</text>

  <!-- Tech chips (chamfered-sm) -->
  <g font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500" text-anchor="middle" fill="#F0F6FC">
    <path d="M72 412h76l8 8v20l-8 8H72l-8-8v-20Z" fill="#161B22" stroke="#39C5BB" stroke-opacity="0.35"/>
    <text x="110" y="435">Python</text>
    <path d="M178 412h88l8 8v20l-8 8h-88l-8-8v-20Z" fill="#161B22" stroke="#39C5BB" stroke-opacity="0.35"/>
    <text x="222" y="435">FastAPI</text>
    <path d="M296 412h120l8 8v20l-8 8H296l-8-8v-20Z" fill="#161B22" stroke="#39C5BB" stroke-opacity="0.35"/>
    <text x="356" y="435">LangChain</text>
    <path d="M446 412h76l8 8v20l-8 8H446l-8-8v-20Z" fill="#161B22" stroke="#39C5BB" stroke-opacity="0.35"/>
    <text x="484" y="435">React</text>
    <path d="M552 412h88l8 8v20l-8 8h-88l-8-8v-20Z" fill="#161B22" stroke="#39C5BB" stroke-opacity="0.35"/>
    <text x="596" y="435">Docker</text>
  </g>

  <!-- Bottom line -->
  <text x="64" y="560" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="500" letter-spacing="2" fill="#48FFF4">willypaz.dev<tspan fill="#8B949E">// PORTFOLIO SYSTEMS</tspan></text>
  <rect x="64" y="584" width="150" height="8" fill="url(#hazard)"/>

  <!-- ============ RIGHT: NERV TERMINAL ============ -->
  <!-- Frame (chamfered 14) -->
  <path d="M686 70h436l14 14v462l-14 14H686l-14-14V84Z" fill="#161B22" stroke="url(#border-grad)" stroke-width="2"/>

  <!-- Header bar -->
  <path d="M686 70h436l14 14v42H672V84Z" fill="#39C5BB" fill-opacity="0.08"/>
  <line x1="672" y1="126" x2="1136" y2="126" stroke="#39C5BB" stroke-opacity="0.35"/>
  <circle cx="694" cy="98" r="8" fill="#48FFF4" opacity="0.25"/>
  <circle cx="694" cy="98" r="5" fill="#48FFF4"/>
  <text x="710" y="103" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="1.5"><tspan fill="#F0F6FC" font-weight="600">WPC-04</tspan><tspan fill="#8B949E"> // SYSTEMS ONLINE</tspan></text>
  <text x="1120" y="103" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FF0080">v2.0.4</text>

  <!-- Screen -->
  <rect x="688" y="142" width="432" height="348" fill="#0F1419"/>

  <!-- Code: Python dataclass (mirrors the hero terminal) -->
  <g font-family="'JetBrains Mono', monospace" font-size="12.5">
    <text x="706" y="166"><tspan fill="#FF0080">from </tspan><tspan fill="#F0F6FC">dataclasses </tspan><tspan fill="#FF0080">import </tspan><tspan fill="#FF0080">dataclass</tspan><tspan fill="#F0F6FC">, </tspan><tspan fill="#FF0080">field</tspan></text>
    <text x="706" y="183"><tspan fill="#FF0080">from </tspan><tspan fill="#F0F6FC">typing </tspan><tspan fill="#FF0080">import </tspan><tspan fill="#39C5BB">List</tspan></text>
    <text x="706" y="217" fill="#FF0080">@dataclass</text>
    <text x="706" y="234"><tspan fill="#FF0080">class </tspan><tspan fill="#39C5BB">Developer</tspan><tspan fill="#F0F6FC">:</tspan></text>
    <text x="706" y="251"><tspan fill="#F0F6FC">    name: </tspan><tspan fill="#FF0080">str</tspan><tspan fill="#F0F6FC"> = </tspan><tspan fill="#00E676">"Willy Samuel Paz Colque"</tspan></text>
    <text x="706" y="268"><tspan fill="#F0F6FC">    role: </tspan><tspan fill="#FF0080">str</tspan><tspan fill="#F0F6FC"> = </tspan><tspan fill="#00E676">"AI &amp; Full Stack Developer"</tspan></text>
    <text x="706" y="285"><tspan fill="#F0F6FC">    location: </tspan><tspan fill="#FF0080">str</tspan><tspan fill="#F0F6FC"> = </tspan><tspan fill="#00E676">"Bolivia"</tspan></text>
    <text x="706" y="302"><tspan fill="#F0F6FC">    experience_years: </tspan><tspan fill="#FF0080">int</tspan><tspan fill="#F0F6FC"> = </tspan><tspan fill="#48FFF4">4</tspan></text>
    <text x="706" y="336"><tspan fill="#F0F6FC">    stack: </tspan><tspan fill="#39C5BB">List</tspan><tspan fill="#F0F6FC">[</tspan><tspan fill="#FF0080">str</tspan><tspan fill="#F0F6FC">] = </tspan><tspan fill="#FF0080">field</tspan><tspan fill="#F0F6FC">(default_factory=</tspan><tspan fill="#F0F6FC">lambda [</tspan></text>
    <text x="706" y="353"><tspan fill="#F0F6FC">        </tspan><tspan fill="#00E676">"Python"</tspan><tspan fill="#F0F6FC">, </tspan><tspan fill="#00E676">"FastAPI"</tspan><tspan fill="#F0F6FC">, </tspan><tspan fill="#00E676">"LangChain"</tspan><tspan fill="#F0F6FC">,</tspan></text>
    <text x="706" y="370"><tspan fill="#F0F6FC">        </tspan><tspan fill="#00E676">"React"</tspan><tspan fill="#F0F6FC">, </tspan><tspan fill="#00E676">"Docker"</tspan><tspan fill="#F0F6FC">, </tspan><tspan fill="#00E676">"AWS"</tspan></text>
    <text x="706" y="387" fill="#F0F6FC">    ])</text>
    <text x="706" y="404"><tspan fill="#F0F6FC">    focus: </tspan><tspan fill="#FF0080">str</tspan><tspan fill="#F0F6FC"> = </tspan><tspan fill="#00E676">"RAG Systems • Scalable APIs • Cloud Infra"</tspan></text>
    <text x="706" y="438" fill="#FF0080">    @property</text>
    <text x="706" y="455"><tspan fill="#FF0080">def </tspan><tspan fill="#F0F6FC">available(</tspan><tspan fill="#F0F6FC">self</tspan><tspan fill="#F0F6FC">) -&gt; </tspan><tspan fill="#F0F6FC">bool</tspan><tspan fill="#F0F6FC">:</tspan></text>
    <text x="706" y="472"><tspan fill="#FF0080">        return</tspan><tspan fill="#F0F6FC"> </tspan><tspan fill="#FF0080">True</tspan><tspan fill="#F0F6FC">  </tspan><tspan fill="#8B949E"># Open to remote work</tspan></text>
    <rect x="852" y="461" width="9" height="14" fill="#48FFF4" opacity="0.85"/>
  </g>

  <!-- SYNC RATE gauge -->
  <line x1="672" y1="502" x2="1136" y2="502" stroke="#21262D"/>
  <text x="694" y="536" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="2" fill="#8B949E">SYNC RATE</text>
  <rect x="790" y="526" width="250" height="10" fill="#21262D"/>
  <rect x="790" y="526" width="240" height="10" fill="url(#border-grad)"/>
  <text x="1122" y="536" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#48FFF4">100%</text>
</svg>
